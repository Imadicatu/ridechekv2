version: '3.8'

# ==============================================================================
# RideCheck Infrastructure Collocation Stack (Same Region: asia-southeast1)
# ==============================================================================
# รวม 3 เซอร์วิสหลักไว้ใน Collocated Virtual Network เดียวกัน:
# 1. ridecheck-app (Node.js App + 14 AI Departments + Telegram Baron Bot)
# 2. ridecheck-redis (Redis Spatial Cache with Geohash <10ms)
# 3. ridecheck-osrm (OSRM Collocated Routing Engine <1ms internal network latency)
# ==============================================================================

services:
  # 1. Node.js RideCheck Backend & Autonomous AI Workforce
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ridecheck-core-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CLOUD_REGION=asia-southeast1
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - ENABLE_REDIS=true
      - OSRM_BASE_URL=http://osrm:5000
      - CARTO_TILE_CDN=https://a.basemaps.cartocdn.com
      - HTTP_KEEP_ALIVE_TIMEOUT=30000
      - HTTP_MAX_SOCKETS=120
    depends_on:
      - redis
    networks:
      - ridecheck-collocation-net

  # 2. Redis Spatial Cache Server (Low Latency < 1ms)
  redis:
    image: redis:7-alpine
    container_name: ridecheck-redis-spatial
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ridecheck-collocation-net

  # 3. Collocated OSRM Server (Local Thailand Routing Engine)
  # หมายเหตุ: สามารถชี้ไปยัง public OSRM ได้ หรือรัน OSRM image ภายในเครื่องเพื่อความเร็วสูงสุด
  osrm:
    image: osrm/osrm-backend:latest
    container_name: ridecheck-osrm-engine
    restart: unless-stopped
    ports:
      - "5000:5000"
    # คำสั่งสตาร์ต OSRM เมื่อดาวน์โหลดไฟล์ thailand-latest.osrm แล้ว:
    # command: osrm-routed --algorithm mld /data/thailand-latest.osrm
    volumes:
      - ./osrm-data:/data
    networks:
      - ridecheck-collocation-net

networks:
  ridecheck-collocation-net:
    driver: bridge

volumes:
  redis-data:
