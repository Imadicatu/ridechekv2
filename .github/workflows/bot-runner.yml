name: RideCheck Autonomous AI Workforce Runner

on:
  schedule:
    # รันอัตโนมัติทุกๆ 30 นาที (เวลามาตรฐาน UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันด้วยตนเองบน GitHub
  push:
    branches:
      - main
      - master
    paths:
      - 'worker-engine.js'
      - 'firebase-bridge.js'

jobs:
  run-autonomous-bots:
    runs-on: ubuntu-latest
    permissions:
      contents: write # เพื่อให้อนุญาต push git commit กลับเข้าคลัง

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🤖 Run Autonomous AI Workforce Cycle
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node worker-engine.js --once

      - name: 💾 Commit & Push Real-Time Updates
        run: |
          git config --local user.email "bot-workforce@ridecheck.th"
          git config --local user.name "RideCheck Autonomous Bot"
          git add project-resources.json logs/
          if git diff --staged --quiet; then
            echo "ไม่มีการเปลี่ยนแปลงใน project-resources.json ไม่จำเป็นต้อง commit"
          else
            git commit -m "🤖 [Automated Workforce] Sync Surge & System Health [skip ci]"
            git push
          fi
